therapist:
  type: deepseek
  base_url: https://api.deepseek.com/v1
  model_id: deepseek-chat
  temperature: 0.7
  top_p: 0.8
  presence_penalty: 1.5
  frequency_penalty: 1.0

patient:
  type: deepseek
  base_url: https://api.deepseek.com/v1
  model_id: deepseek-chat
  profiles: ./data/sample_cactus.json
  temperature: 0.7
  top_p: 0.8
  presence_penalty: 1.5
  frequency_penalty: 1.0

env:
  max_turns: 100
  min_turns: 60
  output_dir: out/deepseek
  verbose: true
  resume_file:
