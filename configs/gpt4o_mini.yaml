# Run with: python simulation.py --cfg configs/gpt4o_mini.yaml --n-profiles 3
# Authentication: GPT_API_KEY in the environment or .env.
therapist:
  type: openai
  base_url: https://api.openai.com/v1
  model_id: gpt-4o-mini
  temperature: 0.7

patient:
  type: openai
  base_url: https://api.openai.com/v1
  model_id: gpt-4o-mini
  temperature: 0.7
  profiles: data/eval_full_cactus/eval_full_cactus.json
  prompt_variant: base

env:
  max_turns: 100
  min_turns: 60
  output_dir: /outs/eval_full_cactus_gpt4o_mini
  verbose: true
  resume_file: ""
  resistance: true
  disable_tib: false
  resistance_handling: none
  long_session_turn_threshold: 70
