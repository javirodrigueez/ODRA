therapist:
  type: deepseek
  base_url: https://api.deepseek.com/v1
  model_id: deepseek-reasoner
  temperature: 1
  top_p: 0.95
  presence_penalty: 1.5
  frequency_penalty: 1.0
  max_tokens: 8192

patient:
  type: local
  base_url: http://localhost:8000/v1
  model_id: /synther/steering/models/Qwen3.5-122B-FP8/
  profiles: ./data/sample_cactus.json
  temperature: 0.7
  top_p: 0.8
  presence_penalty: 1.5
  frequency_penalty: 1.0
  max_tokens: 100000

env:
  max_turns: 100
  min_turns: 60
  output_dir: out/ds-local
  verbose: true
  resume_file:
