therapist:
  type: deepseek
  base_url: https://api.deepseek.com/v1
  model_id: deepseek-reasoner
  temperature: 0.7
  max_tokens: 5000

therapist_struct:
  type: deepseek
  base_url: https://api.deepseek.com/v1
  model_id: deepseek-reasoner
  temperature: 0.2
  max_tokens: 20000

patient:
  type: local
  base_url: http://localhost:8000/v1
  model_id: /synther/steering/models/Qwen3.5-35B-FP8/
  profiles: ./data/sample_cactus.json
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  presence_penalty: 1.5
  repetition_penalty: 1.0
  max_tokens: 128000

patient_struct:
  type: local
  base_url: http://localhost:8000/v1
  model_id: /synther/steering/models/Qwen3.5-35B-FP8/
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0
  max_tokens: 128000

env:
  max_turns: 100
  min_turns: 60
  output_dir: out/ds-local
  verbose: true
  resume_file:
