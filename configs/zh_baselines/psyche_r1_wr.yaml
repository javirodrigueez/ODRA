therapist:
  type: local
  zh_variant: psyche_r1
  base_url: http://localhost:8002/v1  # GPU1 pair, co-located with its own translator (see misc/ZH_BASELINES_HANDOFF.md GPU-colocation note)
  model_id: ft_models/Psyche-R1  # must match vLLM --served-model-name
  ft_system_prompt_path: ft_prompts/standard_zh.txt
  history_limit: 0  # 0 = full history (repo convention); set e.g. 20 to cap context like the other local baselines
  temperature: 0.7
  top_p: 0.9
  max_tokens: 2048

translator:
  base_url: http://localhost:8003/v1  # GPU1 pair
  model_id: google/translategemma-12b-it
  max_tokens: 1024
  # No prompt_mode: vLLM's chat endpoint strips TranslateGemma's source/target_lang_code content keys,
  # so agents/translator.py always renders the model's chat template client-side and calls /v1/completions.

patient:
  type: deepseek
  base_url: https://openrouter.ai/api/v1
  model_id: deepseek/deepseek-v3.2
  temperature: 0.7
  profiles: data/eval_full_cactus/eval_full_cactus.json

topic_exploration:
  patient_classifier_path: BAAI/bge-reranker-v2-m3
  patient_wikipedia_dir: data/wikipedias

env:
  max_turns: 100
  min_turns: 60
  output_dir: /outs/local/Psyche-R1-wr
  verbose: true
  resume_file:
  resistance: true
  disable_tib: false
  resistance_handling: none
  long_session_turn_threshold: 70
