therapist:
  type: local
  zh_variant: soulchat2
  base_url: http://localhost:8000/v1
  model_id: ft_models/SoulChat2.0-Qwen2-7B  # must match vLLM --served-model-name
  ft_system_prompt_path: agent_prompts/soulchat2_system_zh.txt
  history_limit: 0  # 0 = full history (repo convention); set e.g. 20 to cap context like the other local baselines
  temperature: 0.75
  top_p: 0.9
  max_tokens: 4096

translator:
  base_url: http://localhost:8001/v1
  model_id: google/translategemma-12b-it
  max_tokens: 1024
  # No prompt_mode: vLLM's chat endpoint strips TranslateGemma's source/target_lang_code content keys,
  # so agents/translator.py always renders the model's chat template client-side and calls /v1/completions.

patient:
  type: deepseek
  base_url: https://openrouter.ai/api/v1
  model_id: deepseek/deepseek-v3.2
  temperature: 0.7
  profiles: data/eval_full_cactus/eval_full_cactus.json

topic_exploration:
  patient_classifier_path: BAAI/bge-reranker-v2-m3
  patient_wikipedia_dir: data/wikipedias

env:
  max_turns: 100
  min_turns: 60
  output_dir: /outs/local/SoulChat2.0-Qwen2-7B-wor
  verbose: true
  resume_file:
  resistance: false
  disable_tib: false
  resistance_handling: none
  long_session_turn_threshold: 70
