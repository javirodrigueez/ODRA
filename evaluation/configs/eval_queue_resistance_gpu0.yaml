defaults:
  python: python
  gpu_count: 1
  eval:
    enabled: false
    metrics: [ctrs]
    model: gpt-4o
    max_iter: 3
    n_processes: 15
    azure: true
    panas_v2: false
  vllm_args:
    quantization: fp8
    kv-cache-dtype: fp8
    gpu-memory-utilization: 0.95
    language-model-only: true
    enable-prefix-caching: true
    enable-chunked-prefill: true
    max-num-seqs: 50

jobs:
  - id: llama3-cactus
    cfg: evaluation/configs/llama3-cactus-gpu0.yaml
    profiles_path: data/eval_full_cactus/test.json
    n_profiles: 150
    multiprocessing: true
    n_processes: 30
    gpu_count: 2

  - id: llama3-magnet-resistance
    cfg: evaluation/configs/llama3-magnet-resistance-gpu0.yaml
    profiles_path: data/eval_full_cactus/test.json
    n_profiles: 150
    multiprocessing: true
    n_processes: 30
    gpu_count: 2

  - id: llama3-cactus-resistance
    cfg: evaluation/configs/llama3-cactus-resistance-gpu0.yaml
    profiles_path: data/eval_full_cactus/test.json
    n_profiles: 150
    multiprocessing: true
    n_processes: 30
    gpu_count: 2
